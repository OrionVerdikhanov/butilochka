
<svg width="144" height="144" viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg144" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8787;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63447;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottle144" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#ffe8e8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffd4d4;stop-opacity:0.85" />
    </linearGradient>
    <radialGradient id="glow144" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Фон -->
  <rect width="144" height="144" fill="url(#bg144)" rx="31.68"/>

  <!-- Свечение -->
  <circle cx="72" cy="72" r="57.6" fill="url(#glow144)"/>

  <!-- Бутылочка -->
  <g transform="translate(72,72)">
    <!-- Горлышко -->
    <rect x="-11.52" y="-50.4" width="23.04" height="43.199999999999996"
          fill="url(#bottle144)" rx="11.52"/>
    <!-- Тело -->
    <ellipse cx="0" cy="7.2" rx="25.919999999999998" ry="43.199999999999996"
             fill="url(#bottle144)"/>
    <!-- Блик 1 -->
    <ellipse cx="11.52" cy="-14.4" rx="8.64" ry="21.599999999999998"
             fill="#ffffff" opacity="0.6"/>
    <!-- Блик 2 -->
    <circle cx="-7.2" cy="11.52" r="5.76"
            fill="#ffffff" opacity="0.5"/>
    <!-- Блик 3 -->
    <circle cx="14.4" cy="17.28" r="4.32"
            fill="#ffffff" opacity="0.7"/>
  </g>
