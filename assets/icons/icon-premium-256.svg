
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8787;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63447;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottle256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#ffe8e8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffd4d4;stop-opacity:0.85" />
    </linearGradient>
    <radialGradient id="glow256" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Фон -->
  <rect width="256" height="256" fill="url(#bg256)" rx="56.32"/>

  <!-- Свечение -->
  <circle cx="128" cy="128" r="102.4" fill="url(#glow256)"/>

  <!-- Бутылочка -->
  <g transform="translate(128,128)">
    <!-- Горлышко -->
    <rect x="-20.48" y="-89.6" width="40.96" height="76.8"
          fill="url(#bottle256)" rx="20.48"/>
    <!-- Тело -->
    <ellipse cx="0" cy="12.8" rx="46.08" ry="76.8"
             fill="url(#bottle256)"/>
    <!-- Блик 1 -->
    <ellipse cx="20.48" cy="-25.6" rx="15.36" ry="38.4"
             fill="#ffffff" opacity="0.6"/>
    <!-- Блик 2 -->
    <circle cx="-12.8" cy="20.48" r="10.24"
            fill="#ffffff" opacity="0.5"/>
    <!-- Блик 3 -->
    <circle cx="25.6" cy="30.72" r="7.68"
            fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
