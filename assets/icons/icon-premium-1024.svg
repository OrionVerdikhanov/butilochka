
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1024" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8787;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63447;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottle1024" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#ffe8e8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffd4d4;stop-opacity:0.85" />
    </linearGradient>
    <radialGradient id="glow1024" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Фон -->
  <rect width="1024" height="1024" fill="url(#bg1024)" rx="225.28"/>

  <!-- Свечение -->
  <circle cx="512" cy="512" r="409.6" fill="url(#glow1024)"/>

  <!-- Бутылочка -->
  <g transform="translate(512,512)">
    <!-- Горлышко -->
    <rect x="-81.92" y="-358.4" width="163.84" height="307.2"
          fill="url(#bottle1024)" rx="81.92"/>
    <!-- Тело -->
    <ellipse cx="0" cy="51.2" rx="184.32" ry="307.2"
             fill="url(#bottle1024)"/>
    <!-- Блик 1 -->
    <ellipse cx="81.92" cy="-102.4" rx="61.44" ry="153.6"
             fill="#ffffff" opacity="0.6"/>
    <!-- Блик 2 -->
    <circle cx="-51.2" cy="81.92" r="40.96"
            fill="#ffffff" opacity="0.5"/>
    <!-- Блик 3 -->
    <circle cx="102.4" cy="122.88" r="30.72"
            fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
