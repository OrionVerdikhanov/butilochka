
<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg72" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8787;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63447;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottle72" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="50%" style="stop-color:#ffe8e8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffd4d4;stop-opacity:0.85" />
    </linearGradient>
    <radialGradient id="glow72" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Фон -->
  <rect width="72" height="72" fill="url(#bg72)" rx="15.84"/>

  <!-- Свечение -->
  <circle cx="36" cy="36" r="28.8" fill="url(#glow72)"/>

  <!-- Бутылочка -->
  <g transform="translate(36,36)">
    <!-- Горлышко -->
    <rect x="-5.76" y="-25.2" width="11.52" height="21.599999999999998"
          fill="url(#bottle72)" rx="5.76"/>
    <!-- Тело -->
    <ellipse cx="0" cy="3.6" rx="12.959999999999999" ry="21.599999999999998"
             fill="url(#bottle72)"/>
    <!-- Блик 1 -->
    <ellipse cx="5.76" cy="-7.2" rx="4.32" ry="10.799999999999999"
             fill="#ffffff" opacity="0.6"/>
    <!-- Блик 2 -->
    <circle cx="-3.6" cy="5.76" r="2.88"
            fill="#ffffff" opacity="0.5"/>
    <!-- Блик 3 -->
    <circle cx="7.2" cy="8.64" r="2.16"
            fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
